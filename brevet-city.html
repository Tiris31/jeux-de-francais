<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brevet City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: jeu d'action en monde ouvert, nerveux et fun, mais lisible pour réviser
   IDEA: une ville de bord de mer au coucher du soleil ; chaque semaine est une mission, la tour du brevet au bout
   PICTURE: le plan de Brevet City vu du ciel, néons, plage, palmiers, marqueur GPS sur la mission en cours
   COLOUR and TYPE: nuit violette, rose néon, orange coucher de soleil, turquoise ; Anton + Atkinson Hyperlegible
   LAYOUT: HUD en haut, plan, panneau de mission ; en mission, un écran à la fois avec bandeaux de jeu */
:root{color-scheme:dark;
--bg:#140a24;--card:#1f1236;--ink:#fff4fb;--soft:#c9b6d9;
--sky:#1a1030;--r1:#ff8a3d;--r2:#ff2e88;--r3:#19d3c5;
--act:#ff2e88;--act2:#a3105a;--good:#3ddc84;--bad:#ff4d4d;
--line:#3a2558;--chip:#2a1946;--hi:#ffd23f}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:linear-gradient(180deg,rgba(255,138,61,.22),rgba(255,46,136,.08) 220px,transparent 420px),var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--act);outline-offset:2px}
h1,h2,h3,.title{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em;text-transform:uppercase}
.top{display:flex;align-items:center;gap:10px;padding:14px max(4vw,14px);flex-wrap:wrap}
.top h1{font-size:clamp(30px,5vw,44px);margin-right:auto;color:var(--r2);text-shadow:3px 3px 0 var(--r1)}
.pill{background:var(--chip);border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.pbtn{background:var(--chip);border-radius:99px;padding:8px 16px;font-weight:700;min-height:44px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,14px) 40px}
.mapbox{background:var(--sky);border-radius:22px;overflow:hidden;box-shadow:0 0 0 2px var(--r2),0 0 28px rgba(255,46,136,.35)}
.mapbox svg{display:block;width:100%;height:auto}
.panel{background:var(--card);border-radius:22px;padding:clamp(18px,3vw,30px);margin-top:16px;box-shadow:0 0 0 1px var(--line)}
.go{background:var(--act);color:#fff;font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase;font-size:21px;border-radius:16px;padding:12px 24px;min-height:54px;box-shadow:0 5px 0 var(--act2)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--act2)}
.go.big{width:100%;font-size:clamp(20px,3vw,27px);padding:16px}
.go[disabled]{opacity:.45}
.sec{background:var(--chip);font-weight:700;border-radius:14px;padding:10px 16px;min-height:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.weeks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wk{background:var(--chip);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700;font-size:14px}
.wk.cur{background:var(--hi);color:#140a24}
.muted{color:var(--soft);font-size:15px}
.kicker{font-weight:700;color:var(--r3);margin:0 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.mbar{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px)}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:40px;height:10px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--act)}.dots i.done{background:var(--r1)}
.clock{display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.clock svg{width:36px;height:36px}
.stage{background:var(--card);border-radius:22px;max-width:860px;margin:0 auto;padding:clamp(20px,4vw,38px);min-height:58vh;box-shadow:0 0 0 1px var(--line),0 0 30px rgba(25,211,197,.12)}
.stage h2{font-size:clamp(28px,4.6vw,42px);font-weight:800}
.q{font-size:clamp(21px,3.2vw,28px);font-weight:700;margin:12px 0 0;line-height:1.35}
.hint{color:var(--soft);margin:8px 0 0}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:18px}
.opt{text-align:left;background:var(--chip);border:3px solid var(--line);border-radius:16px;padding:12px 16px;min-height:60px;font-size:clamp(17px,2.4vw,21px);font-weight:700}
.opt:hover{border-color:var(--act)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fbok{color:var(--good);font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:30px;margin:14px 0 0}
.fbno{color:var(--bad);font-weight:700;margin:14px 0 6px}
.expl{background:var(--chip);border-radius:14px;padding:12px 14px;margin-top:8px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{background:var(--chip);border:3px solid var(--line);border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;min-height:52px}
.tile[disabled]{opacity:.25}
.line{min-height:64px;border:3px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:22px;font-weight:700;margin-top:14px}
input[type=text],textarea,select{font:inherit;font-size:18px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);min-height:50px}
textarea{min-height:110px;resize:vertical}
select{max-width:380px}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acc button{background:var(--chip);border-radius:10px;min-width:44px;min-height:44px;font-weight:700;font-size:19px}
.check{display:grid;gap:8px;margin-top:12px}
.check label{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:24px;height:24px;flex:none;margin-top:2px}
.model{background:var(--hi);color:#1e1b2e;border-radius:14px;padding:12px 16px;font-weight:700;margin-top:10px}
.stars{display:flex;gap:10px;justify-content:center;margin:12px 0}
.stars svg{width:clamp(54px,11vw,80px)}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:10px;max-width:420px}
.week7 div{aspect-ratio:1;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--soft)}
.week7 div.on{background:var(--r2);color:#fff}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:8em minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:15px}
.bar b{display:block;height:16px;border-radius:8px;background:var(--r1)}
.bar span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dict{font-size:clamp(19px,2.6vw,23px);line-height:1.8;margin-top:12px}
.dict .ko{background:rgba(196,47,38,.18);text-decoration:underline wavy var(--bad);border-radius:4px}
.dict .miss{color:var(--bad);font-weight:700}
.err{border-top:1px solid var(--line);padding:10px 0}
label.lb{font-weight:700;display:block;margin:14px 0 6px}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px}
.chk input{width:24px;height:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}
.ai{white-space:pre-wrap;background:var(--chip);border-radius:14px;padding:12px 14px;margin-top:10px}
.climber{animation:bob 1.8s ease-in-out infinite}.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
.banner{margin:6px -10px 8px;padding:14px 18px;background:linear-gradient(90deg,var(--r2),var(--r1));transform:skewX(-8deg);text-align:center}.banner h2{transform:skewX(8deg);color:#fff;font-size:clamp(34px,7vw,58px);text-shadow:3px 3px 0 #140a24}
.hud{font-family:Anton,Impact,sans-serif;letter-spacing:.04em;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:6px 12px;white-space:nowrap}.hud .xp{color:var(--good)}.hud .st{color:var(--hi)}
@keyframes bob{50%{transform:translateY(-5px)}}
.msg{display:flex;gap:12px;align-items:center;margin:10px 0}.msg svg{flex:none;filter:drop-shadow(0 0 6px rgba(25,211,197,.55))}.msg svg path{animation:nova 1.2s ease-in-out infinite}@keyframes nova{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.msg svg path{animation:none}}
.bub{position:relative;background:#fff4fb;color:#140a24;border-radius:16px;padding:10px 14px;margin:0;font-weight:700;max-width:560px}
.bub b{color:var(--act2)}
.foe{float:right;width:84px;margin:0 0 6px 12px;text-align:center}.foe svg{width:84px;height:84px;display:block}
.foe.hit svg{animation:poof .6s forwards}.foe.laugh svg{animation:shake .5s}
@keyframes poof{40%{transform:scale(1.25);filter:brightness(2)}100%{transform:scale(.2);opacity:0}}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.road{border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px var(--r2)}.road svg{display:block;width:100%;height:auto}
.drive{animation:drive 2.6s linear forwards}@keyframes drive{from{transform:translateX(-240px)}to{transform:translateX(640px)}}
.garage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-top:14px}
.gcard{background:var(--chip);border-radius:16px;padding:14px;border:3px solid transparent}.gcard.sel{border-color:var(--r2)}.gcard.lock{opacity:.55}
.gcard svg{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 50% 70%,#2c3a2e 0,#141a16 70%);border-radius:12px}.gcard h3{font-size:22px;margin:6px 0 4px}
.fault{display:flex;align-items:center;gap:14px;margin:10px 0}.fault .foe{float:none;margin:0;flex:none;width:72px}.fault .foe svg{width:72px;height:72px}.fault .fbno{margin:0}
.gbar{margin:16px 0 6px;padding:12px;border:1px dashed var(--line);border-radius:14px;clear:both}.gt{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--r3);font-weight:700}.gads{display:flex;flex-wrap:wrap;gap:8px}.gad{flex:1 1 150px;display:flex;flex-direction:column;gap:3px;text-align:left;background:#140a24;color:#fff;border:2px solid var(--r3);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit;box-shadow:0 0 10px rgba(25,211,197,.25)}.gad b{font-size:15px}.gad span{font-size:14px;opacity:.9}.gad i{font-style:normal;font-size:12px;color:var(--r3)}.gad:disabled{opacity:.42;cursor:default;box-shadow:none}.gnote{margin:8px 0 0;font-size:14px}.opt.gone{opacity:.25;text-decoration:line-through}
.sndnote{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,560px);background:#fff4fb;color:#140a24;border-radius:14px;padding:12px 16px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50}.sec.on{box-shadow:0 0 0 3px var(--r3),0 0 14px rgba(25,211,197,.6)}
.zap{color:var(--r3);font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em}
@media(prefers-reduced-motion:reduce){.climber,.pulse,.drive,.foe.hit svg,.foe.laugh svg{animation:none}.drive{transform:translateX(200px)}}
@media(max-width:600px){.dots i{width:24px}.bar{grid-template-columns:6.5em minmax(0,1fr) 3em}}
</style>
</head>
<body>
<div id="view"></div>
<script>
{
/* ---------- banques d'exercices : [question, choix, index bonne réponse, explication] ---------- */
const B={
classes:{tag:"6e",items:[
["Dans « Il marche vite », « vite » est…",["un adverbe","un adjectif","un nom"],0,"« vite » modifie le verbe « marche » : c'est un adverbe, invariable."],
["Dans « Ce roman est passionnant », « ce » est…",["un déterminant démonstratif","un pronom démonstratif","un adjectif"],0,"« ce » accompagne le nom « roman » : c'est un déterminant."],
["Dans « Elle le regarde », « le » est…",["un pronom personnel","un déterminant","une préposition"],0,"« le » remplace un nom et sert de COD : pronom personnel."],
["« Pendant » est…",["une préposition","une conjonction de coordination","un adverbe"],0,"« pendant » introduit un groupe nominal : préposition."],
["Dans « Il partit parce qu'il était las », « parce qu' » est…",["une conjonction de subordination","une conjonction de coordination","une préposition"],0,"Il introduit une proposition subordonnée."],
["Dans « Ses souvenirs sont précieux », « précieux » est…",["un adjectif","un adverbe","un nom"],0,"Il qualifie « souvenirs » et s'accorde avec lui."],
["Dans « Celui-ci me plaît », « celui-ci » est…",["un pronom démonstratif","un déterminant démonstratif","un adverbe"],0,"Il remplace un nom : pronom."]]},
fonctions:{tag:"6e-5e",items:[
["« Il parle à son frère. » Fonction de « à son frère » ?",["COI","COD","CC de lieu"],0,"On parle à quelqu'un : complément introduit par « à », non déplaçable."],
["« Les élèves lisent un roman. » Fonction de « un roman » ?",["COD","sujet","attribut du sujet"],0,"Ils lisent quoi ? un roman."],
["« Elle semble heureuse. » Fonction de « heureuse » ?",["attribut du sujet","COD","épithète"],0,"Après le verbe d'état « sembler »."],
["« Chaque matin, il écrit son journal. » Fonction de « Chaque matin » ?",["CC de temps","sujet","COD"],0,"Déplaçable, supprimable, il dit quand."],
["« Le vieux château domine la ville. » Fonction de « vieux » ?",["épithète","attribut du sujet","COD"],0,"Adjectif placé directement à côté du nom."],
["« Rousseau, philosophe genevois, se raconte. » Fonction de « philosophe genevois » ?",["apposition","COD","attribut du sujet"],0,"Groupe détaché par des virgules qui précise le nom."],
["« Le roi a été trahi par son fils. » Fonction de « par son fils » ?",["complément d'agent","COI","CC de moyen"],0,"Dans une phrase passive, il indique qui fait l'action."]]},
props:{tag:"5e",items:[
["Combien de propositions dans « Il pleut, je reste à la maison et je lis. » ?",["3","2","1"],0,"Trois verbes conjugués : pleut, reste, lis."],
["« Il pleut, je reste. » Les propositions sont…",["juxtaposées","coordonnées","subordonnées"],0,"Reliées par une virgule."],
["« Il pleut mais je sors. » Les propositions sont…",["coordonnées","juxtaposées","subordonnées"],0,"Reliées par « mais », conjonction de coordination."],
["« Je sors bien qu'il pleuve. » « bien qu'il pleuve » est une proposition…",["subordonnée","indépendante","principale"],0,"Introduite par une conjonction de subordination."],
["Laquelle est une phrase simple ?",["Au lever du soleil, le jeune homme quitta son village.","Il partit quand le soleil se leva.","Il se leva, il partit."],0,"Un seul verbe conjugué."],
["Dans « Je crois qu'il ment », quelle est la principale ?",["Je crois","qu'il ment","il ment"],0,"La principale est celle dont dépend la subordonnée."]]},
sub:{tag:"4e",items:[
["« Le livre dont je parle est ancien. » « dont je parle » est une subordonnée…",["relative","complétive","circonstancielle"],0,"Introduite par le pronom relatif « dont », elle complète « livre »."],
["« Je sais qu'il viendra. » « qu'il viendra » est une subordonnée…",["complétive","relative","circonstancielle"],0,"Introduite par « que », COD de « sais »."],
["« La ville où je suis né a changé. » Antécédent de « où » ?",["la ville","je","né"],0,"Le pronom relatif reprend le nom « ville »."],
["« L'homme que tu vois est poète. » Fonction de « que » dans la relative ?",["COD de « vois »","sujet de « vois »","COI"],0,"Tu vois qui ? l'homme, repris par « que »."],
["« Il annonce que la guerre est finie. » Fonction de la subordonnée ?",["COD de « annonce »","sujet","complément du nom"],0,"Il annonce quoi ? → complétive COD."],
["Complète : « C'est une œuvre ___ l'auteur est célèbre. »",["dont","que","où"],0,"L'auteur de l'œuvre : complément du nom → « dont »."],
["Complète : « Le pays ___ je rêve est lointain. »",["dont","que","où"],0,"Rêver de quelque chose → « dont »."]]},
cc:{tag:"3e",items:[
["« Comme il pleuvait, le défilé fut annulé. » La subordonnée exprime…",["la cause","la conséquence","le but"],0,"« Comme » en tête de phrase introduit la cause."],
["« Il était si fatigué qu'il s'endormit. » La relation est…",["la conséquence","la cause","la concession"],0,"« si… que » exprime la conséquence."],
["Choisis : « Il a beaucoup lu ; ___, il connaît bien Hugo. »",["c'est pourquoi","pourtant","bien que"],0,"Avoir beaucoup lu entraîne la connaissance : conséquence."],
["Choisis : « Il reste chez lui ___ il est malade. »",["parce qu'","bien qu'","afin qu'"],0,"La maladie est la cause."],
["Choisis : « ___ tu insistes, je viendrai. »",["Puisque","Pour que","Bien que"],0,"« Puisque » : cause connue de tous."],
["Quel connecteur exprime la cause ?",["en effet","par conséquent","néanmoins"],0,"« en effet » justifie ce qui précède."],
["Choisis : « Il parlait fort, ___ tout le monde l'entendait. »",["si bien que","bien que","pour que"],0,"Conséquence + indicatif."]]},
bo:{tag:"3e",items:[
["« Il travaille pour que ses enfants soient libres. » Relation ?",["le but","la cause","la conséquence"],0,"« pour que » exprime le but, suivi du subjonctif."],
["Choisis le bon mode : « Afin que tu ___ la vérité… »",["saches","sais","sauras"],0,"« afin que » est toujours suivi du subjonctif."],
["« Ismène obéit, alors qu'Antigone refuse. » Relation ?",["l'opposition","la cause","le but"],0,"Deux attitudes mises face à face."],
["Choisis : « Il aime la ville ; ___, sa sœur préfère la campagne. »",["en revanche","c'est pourquoi","en effet"],0,"Opposition entre deux préférences."],
["Choisis : « Il étudie ___ réussir. »",["afin de","afin que","parce que"],0,"Même sujet : préposition + infinitif."],
["« De peur qu'on ne le reconnaisse, il se cacha. » Relation ?",["le but (éviter quelque chose)","la cause","la conséquence"],0,"« de peur que » : but négatif, + subjonctif."]]},
conc:{tag:"3e",items:[
["« Bien qu'il soit roi, Créon doute. » Relation ?",["la concession","la cause","la conséquence"],0,"On admet un fait qui n'empêche pas l'autre."],
["Choisis le bon mode : « Bien qu'il ___ tard, il continue. »",["soit","est","sera"],0,"« bien que » est suivi du subjonctif."],
["Choisis le bon mode : « Même si tu ___ raison, tais-toi. »",["as","aies","aurais"],0,"« même si » est suivi de l'indicatif."],
["Quelle phrase est correcte ?",["Malgré la pluie, il sortit.","Malgré qu'il pleuve, il sortit.","Malgré qu'il pleut, il sortit."],0,"« malgré » + nom ; « malgré que » est à éviter."],
["Choisis : « Il était épuisé ; ___, il termina la course. »",["pourtant","donc","car"],0,"La fatigue aurait dû l'arrêter : concession."],
["Choisis : « ___ il fût pauvre, il restait généreux. »",["Quoiqu'","Parce qu'","Puisqu'"],0,"« quoique » (= bien que) + subjonctif."],
["« quoique » ou « quoi que » : « ___ tu dises, je pars. »",["Quoi que","Quoique"],0,"« Quoi que » = quelle que soit la chose que."],
["« Certes, la science progresse, mais elle inquiète. » Ce mouvement est…",["une concession suivie d'une objection","une cause","une conséquence"],0,"« certes… mais » : on concède, puis on objecte."]]},
cond:{tag:"3e",items:[
["Choisis : « Si j'___ su, je serais venu. »",["avais","aurais","aie"],0,"Jamais de conditionnel après « si »."],
["Choisis : « Si tu viens, nous ___ ensemble. »",["partirons","partirions","partions"],0,"Si + présent → futur."],
["Choisis : « Si tu venais, nous ___ ensemble. »",["partirions","partirons","partîmes"],0,"Si + imparfait → conditionnel présent."],
["Choisis le mode : « Il viendra à condition qu'on l'___. »",["invite","invitera","inviterait"],0,"« à condition que » + subjonctif."],
["Choisis le mode : « Au cas où il ___, préviens-moi. »",["pleuvrait","pleuve","pleut"],0,"« au cas où » + conditionnel."],
["« S'il avait écouté, il aurait compris. » Ce système exprime…",["l'irréel du passé","le potentiel","une cause"],0,"Si + plus-que-parfait → conditionnel passé."],
["Choisis : « Pourvu qu'il ___ beau demain ! »",["fasse","fait","fera"],0,"« pourvu que » + subjonctif."]]},
subjf:{tag:"4e",items:[
["Il faut que tu ___ (finir).",["finisses","finis","finiras"],0,"Radical de « ils finissent » + -es."],
["Il faut qu'il ___ (faire) attention.",["fasse","fait","fera"],0,"Faire → qu'il fasse."],
["Je veux que nous ___ (aller) au théâtre.",["allions","allons","irons"],0,"Aller → que nous allions."],
["Il faut que vous ___ (être) prêts.",["soyez","êtes","serez"],0,"Être → que vous soyez."],
["Il faut qu'ils ___ (avoir) du courage.",["aient","ont","auront"],0,"Avoir → qu'ils aient."],

function ask(it,kick,done){if(it.b)return build(it,kick,done);if(it.t)return typing(it,kick,done);
 const [q,o,ai,x]=it,order=shuffle(o.map((_,j)=>j));

function result(ok,it){const q=qOf(it),re=Q&&Q.retry;if(!re)track(QCAT[q]||"conn",q,ansOf(it),xOf(it),ok);M.tot++;if(ok){M.ok++;if(!re)delErr(it)}else if(!re)addErr(it);beep(ok);if(Q){Q.done=true;refreshG()}}

function build(it,kick,done){const parts=it.b,tiles=shuffle(parts.map((_,i)=>i));let got=[];Q={kind:"build",done:false,n:parts.length};Q.reveal=()=>{Q.hinted=true;got=[0,1];draw()};

 ACT.ck=()=>{const v=ta.value.trim();if(v.length<8)return;const hasC=pr.rx.test(v);
  $("#fb").innerHTML=`<p class="${hasC?'fbok':'fbno'}" style="font-size:20px">${hasC?"Le connecteur demandé est bien là.":"Je ne trouve pas « "+esc(pr.k)+" » : relis la consigne."}</p>
  <p class="hint">Vérifie toi-même :</p><div class="check">${["Le connecteur exprime bien la relation voulue.","Le mode est le bon (subjonctif après bien que, pour que, avant que…).","Les accords sont faits (verbe, participe, adjectifs).","La ponctuation est juste."].map((t,i)=>`<label><input type="checkbox" class="ckb"> ${t}</label>`).join("")}</div>
  <p class="hint" style="margin-top:14px">Un modèle possible :</p><p class="model">${esc(pr.m)}</p><div class="row"><button class="go" data-a="nx">Valider</button></div>`;
  S.phr.push({d:tk(new Date()),w:M.wk,t:v,k:pr.k});if(S.phr.length>80)S.phr.shift();
  ACT.nx=()=>{const n=document.querySelectorAll(".ckb:checked").length;M.tot++;const good=hasC&&n>=3;if(good)M.ok++;track("phr",pr.p,pr.m,"Connecteur attendu : "+pr.k,good);save();next()}}}
function stepWin(){stopTimer();const r=M.tot?M.ok/M.tot:1,st=r>=.85?3:r>=.6?2:1;S.missions[M.wk]=(S.missions[M.wk]||0)+1;const t=tk(new Date());if(!S.days.includes(t))S.days.push(t);savedGame();
 const d=new Date(),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const cells=["L","M","M","J","V","S","D"].map((l,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return `<div class="${S.days.includes(tk(x))?'on':''}">${l}</div>`}).join("");
 const mb=M.brevet&&S.mb.length?S.mb[S.mb.length-1].s:null;
 const wk=weakest(),x1=xp(),nu=CARS.concat(GUNS).filter(o=>o.xp>M.xp0&&o.xp<=x1);
 stage(`<div class="banner"><h2>Mission réussie</h2></div>${linaSay("wow",pick(LL.win)+(nu.length?" Et regarde : "+nu.map(o=>"« "+esc(o.n)+" »").join(" et ")+" débloqué"+(nu.length>1?"s":"")+" au garage !":""))}<p class="q" style="text-align:center;color:var(--good);font-family:Anton,Impact,sans-serif">+${100+(mb||0)*10} XP</p><p class="q" style="text-align:center">Bien joué, ${esc(nm())} !</p><div class="stars">${STAR(st>=1)+STAR(st>=2)+STAR(st>=3)}</div><p class="q" style="text-align:center">${M.ok} bonnes réponses sur ${M.tot}${mb!==null?` · mini-brevet : ${mb}/10`:""}</p>${wk?`<p class="expl">Ton point à travailler en ce moment : <b>${esc(CAT[wk])}</b>. NOVA le glissera dans tes prochains rappels.</p>`:""}<p class="hint" style="margin-top:16px">Ma semaine :</p><div class="week7">${cells}</div><p class="muted" style="margin-top:10px">${streak()} soir${streak()>1?"s":""} d'affilée · ${S.err.length} erreur${S.err.length>1?"s":""} dans le carnet, reprises au prochain rappel.</p><div class="row"><button class="go" data-a="home">Retour au plan</button><button class="sec" data-a="garage">Garage</button></div>`)}
/* ---------- dictée flash ---------- */
function showDictee(){place="dictee";ACT={};const idx=S.dict.length%DICT.length,txt=DICT[idx],sents=txt.match(/[^.;!?]+[.;!?]+/g).map(s=>s.trim());
 view.innerHTML=`<div class="mbar"><div class="dots"></div><button class="pbtn" data-a="home">Carte</button></div><main class="wrap"><section class="stage" id="stage"></section></main>`;
 stage(`<p class="kicker">Dictée flash n° ${idx+1}</p><h2>Écoute, puis écris</h2>${canSpeak()?`<p class="hint">Chaque bouton lit un morceau. Tu peux le réécouter autant que tu veux.</p><div class="row">${sents.map((s,i)=>`<button class="sec" data-a="pl" data-i="${i}">Écouter ${i+1}</button>`).join("")}<button class="sec" data-a="all">Tout relire</button></div><details style="margin-top:8px"><summary class="muted">Pas de son ? Texte pour l'adulte qui lit la dictée</summary><p class="expl">${esc(txt)}</p></details>`:`<p class="hint">Aucune voix française sur cet appareil : demande à un adulte de lire le texte ci-dessous, phrase par phrase.</p><details><summary class="muted">Afficher le texte pour l'adulte</summary><p class="expl">${esc(txt)}</p></details>`}<textarea id="dt" style="margin-top:14px;min-height:160px" placeholder="Écris la dictée ici…" spellcheck="false" autocapitalize="off"></textarea><div class="acc">${["â","ê","î","û","é","è","à","ç","ù","ë","ï"].map(c=>`<button data-a="ins" data-c="${c}">${c}</button>`).join("")}</div><div class="row"><button class="go" data-a="ck">Corriger</button></div><div id="fb"></div>`);
 const ta=$("#dt");ACT.ins=b=>{const c=b.dataset.c,s=ta.selectionStart;ta.value=ta.value.slice(0,s)+c+ta.value.slice(ta.selectionEnd);ta.focus();ta.setSelectionRange(s+1,s+1)};
 const lit=b=>{document.querySelectorAll("[data-a=pl],[data-a=all]").forEach(x=>x.classList.remove("on"));b.classList.add("on");setTimeout(()=>b.classList.remove("on"),2500)};ACT.pl=b=>{lit(b);say(sents[+b.dataset.i],0.78)};ACT.all=b=>{lit(b);say(sents,0.85)};
 ACT.ck=()=>{const v=ta.value.trim();if(v.length<10){$("#fb").innerHTML=`<p class="fbno">Écoute la dictée et écris au moins une phrase avant de corriger.</p>`;ta.focus();return}const res=diff(txt,v);S.dict.push({d:tk(new Date()),i:idx,e:res.errors});const st=S.st.dict||(S.st.dict={ok:0,ko:0});st.ko+=res.errors;st.ok+=Math.max(0,res.words-res.errors);res.missed.forEach(w=>S.dmiss[w]=(S.dmiss[w]||0)+1);savedGame();
  $("#fb").innerHTML=`<p class="${res.errors===0?'fbok':'fbno'}" style="font-size:22px">${res.errors===0?"Zéro faute, bravo !":res.errors+" mot"+(res.errors>1?"s":"")+" à corriger"}</p><p class="hint">Le texte, avec tes erreurs soulignées :</p><div class="dict">${res.html}</div><p class="muted" style="margin-top:10px">Recopie dans ton carnet chaque mot souligné avec la règle qui l'explique.</p><div class="row"><button class="go" data-a="home">Terminer</button></div>`}}
function diff(ref,got){const tok=s=>s.replace(/[’]/g,"'").replace(/([«»;:!?.,])/g," $1 ").split(/\s+/).filter(Boolean);const a=tok(ref),b=tok(got);const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let i=0,j=0,out=[],errors=0,missed=[];while(i<n){if(j<m&&a[i]===b[j]){out.push(esc(a[i]));i++;j++}else if(j<m&&L[i][j+1]>=L[i+1][j]){j++}else{const isP=/^[«»;:!?.,]$/.test(a[i]);if(!isP){errors++;missed.push(a[i])}out.push(`<span class="${isP?'miss':'ko'}">${esc(a[i])}</span>`);i++}}
 return {errors,missed,words:a.filter(t=>!/^[«»;:!?.,]$/.test(t)).length,html:out.join(" ").replace(/ ([,.])/g,"$1")}}
/* ---------- la forge du subjonctif ---------- */
function showForge(){place="forge";view.innerHTML=`<div class="mbar"><div class="dots"></div><button class="pbtn" data-a="home">Carte</button></div><main class="wrap"><section class="stage" id="stage"></section></main>`;
 M={wk:S.week,ok:0,tot:0};const items=shuffle(B.isj3.items.filter(x=>x.t).concat(B.isj.items.filter(x=>x.t))).slice(0,8);
 stage(`<p class="kicker">Atelier du subjonctif</p><div class="banner"><h2>Imparfait du subjonctif</h2></div><p class="model">Pars du passé simple « tu… » et ajoute « -se » : tu vins → que je vinsse → qu'il vînt.</p><p class="hint">8 formes à forger, accents compris.</p><div class="row"><button class="go" data-a="g">Entrer dans l'atelier</button></div>`);
 ACT.g=()=>series(items,"Atelier",()=>{savedGame();stage(`<p class="kicker">Atelier du subjonctif</p><h2>${M.ok} formes justes sur ${M.tot}</h2><p class="hint">Les formes ratées sont dans ton carnet d'erreurs.</p><div class="row"><button class="go" data-a="home">Retour au plan</button><button class="sec" data-a="forge">Encore une série</button></div>`)})}
/* ---------- espace parent ---------- */
function bars(rows,max){return `<div class="bars">${rows.map(r=>`<div class="bar"><span>${esc(r[0])}</span><span><b style="width:${Math.max(3,r[1]/max*100)}%"></b></span><span>${esc(r[2])}</span></div>`).join("")}</div>`}
function showParent(){place="parent";ACT={};const mb=S.mb.slice(-10),dc=S.dict.slice(-8);
 view.innerHTML=topBar()+`<main class="wrap"><div class="panel"><h2 class="title" style="font-size:34px">Espace parent</h2><p class="muted" id="sync">${dbRef?"La progression est enregistrée en ligne, dans votre compte.":"La progression est enregistrée dans ce navigateur."}</p><div class="bkp" style="margin:12px 0 18px;padding:14px;border:1px dashed rgba(127,127,127,.5);border-radius:14px"><h3 style="margin:0 0 6px">Sauvegarde automatique</h3><p class="muted" style="margin:0 0 8px">La progression s'enregistre toute seule après chaque réponse et à la fin de chaque partie. Dernier enregistrement : <b>${fmtD(S.updated)}</b>.</p><p class="muted" style="margin:0 0 8px">Pour continuer sur un autre téléphone ou depuis un autre lien : envoyez le code de sauvegarde (par exemple par WhatsApp), puis collez-le dans l'espace parent de l'autre appareil. Astuce : ouvrez le jeu dans Safari ou Chrome plutôt que dans le navigateur de WhatsApp, qui peut effacer la progression.</p><div class="row"><button class="sec" data-a="bkc">Copier le code de sauvegarde</button>${navigator.share?'<button class="sec" data-a="bks">Envoyer le code</button>':""}</div><textarea id="bkt" style="margin-top:10px;min-height:70px;width:100%" placeholder="Pour reprendre une partie : collez ici un code de sauvegarde…" spellcheck="false" autocapitalize="off"></textarea><div class="row"><button class="sec" data-a="bkr">Reprendre la partie de ce code</button></div><p class="hint" id="bkm"></p></div>
 <div class="grid2"><div><label class="lb" for="pn">Prénom</label><input type="text" id="pn" value="${esc(S.name)}" placeholder="Prénom" autocomplete="off">
 <label class="lb" for="wk">Semaine du programme</label><select id="wk">${W.map((w,i)=>`<option value="${i+1}" ${i+1===S.week?"selected":""}>S${i+1} · ${esc(w.t)}</option>`).join("")}</select>
 <label class="lb" for="vc">Voix pour la dictée</label><select id="vc"><option value="">Automatique : meilleure voix de France</option>${frVoices.map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}${tts?`<option value="claude" ${S.voice==="claude"?"selected":""}>Voix intégrée</option>`:""}</select>
 <div class="row"><button class="sec" data-say="Bien qu'il fût tard, le jeune homme ne voulait pas rentrer.">Écouter un exemple</button></div>
 <label class="chk"><input type="checkbox" id="sl" ${S.slow?"checked":""}> Voix lente</label>
 <h3 style="margin-top:22px">Mini-brevets (sur 10)</h3>${mb.length?bars(mb.map(x=>[x.d.slice(8)+"/"+x.d.slice(5,7)+" · S"+x.w,x.s,x.s+"/10"]),10):'<p class="muted">Pas encore de mini-brevet.</p>'}
 <h3 style="margin-top:22px">Dictées (mots à corriger)</h3>${dc.length?bars(dc.map(x=>[x.d.slice(8)+"/"+x.d.slice(5,7)+" · n°"+(x.i+1),Math.max(1,x.e),String(x.e)]),Math.max(...dc.map(x=>x.e),1)):'<p class="muted">Pas encore de dictée.</p>'}</div>
 <div>${errorReport()}<h3 style="margin-top:22px">Carnet d'erreurs à revoir (${S.err.length})</h3>${S.err.length?S.err.slice(-12).reverse().map(e=>{const it=e.it;const q=it.q||it[0];const a=it.t?it.ans[0]:it.b?it.b.join(" "):it[1][it[2]];return `<div class="err"><b>${esc(q)}</b><br><span class="muted">Réponse : ${esc(a)}</span></div>`}).join(""):'<p class="muted">Vide pour l\'instant.</p>'}
 <h3 style="margin-top:22px">Dernières phrases écrites</h3>${S.phr.length?S.phr.slice(-5).reverse().map(p=>`<div class="err"><span class="muted">${esc(p.k)}</span><br>${esc(p.t)}</div>`).join(""):'<p class="muted">Aucune phrase pour l\'instant.</p>'}
 <h3 style="margin-top:22px">Recommencer</h3><div class="row" id="rz"><button class="sec" data-a="r1">Effacer la progression</button></div></div></div>
 <div class="row"><button class="go" data-a="home">Retour au plan</button></div></div></main>`;
 $("#pn").addEventListener("change",e=>{S.name=e.target.value.slice(0,30);save()});
 $("#wk").addEventListener("change",e=>{S.week=+e.target.value;save()});
 $("#vc").addEventListener("change",e=>{S.voice=e.target.value;save()});
 $("#sl").addEventListener("change",e=>{S.slow=e.target.checked;save()});
 ACT.r1=()=>{$("#rz").innerHTML=`<button class="go" data-a="r2">Oui, tout effacer</button><button class="sec" data-a="parent">Annuler</button>`};
 ACT.r2=()=>{const n=S.name;S=clone(DEF);S.name=n;save();showParent()};
 const bkm=m=>{$("#bkm").textContent=m};
 ACT.bkc=async()=>{save();const c=mkCode();try{await navigator.clipboard.writeText(c);bkm("Code copié. Collez-le dans un message pour l'envoyer.")}catch(e){const t=$("#bkt");t.value=c;t.focus();t.select();bkm("Le code est affiché dans la case : sélectionnez-le et copiez-le.")}};
 ACT.bks=async()=>{save();try{await navigator.share({title:"Sauvegarde Brevet City",text:mkCode()})}catch(e){}};
 ACT.bkr=()=>{const d=readCode($("#bkt").value);if(!d){bkm("Ce code n'est pas reconnu. Vérifiez qu'il a été copié en entier.");return}S=Object.assign(clone(DEF),d);savedGame();showParent();bkm("Partie reprise : progression du "+fmtD(d.updated)+".")}}
/* ---------- démarrage ---------- */
showMap();
(async()=>{try{if(!window.claude||!claude.use)return;const t=await claude.use("tts");if(t)tts=t}catch(e){}})();
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use("db"),u=await claude.use("user");if(!db||!u)return;const id=await u.id();if(!id)return;const ref=db.doc("data/users/"+id+"/progress");
 const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);dbRef=ref;
 if(snap.exists){const d=snap.data();if(d&&d.v===1&&(d.updated||0)>(S.updated||0)){S=Object.assign(clone(DEF),clone(d));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(place==="map")showMap();if(place==="parent")showParent()}}
 else if(S.updated)save();const sy=$("#sync");if(sy)sy.textContent="La progression est enregistrée en ligne, dans votre compte."}catch(e){}})();
}
</script>
